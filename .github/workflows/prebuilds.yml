name: Node-API prebuilds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Build Linux Node-API prebuild on the glibc 2.31 baseline
        if: matrix.platform == 'linux'
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            node:20-bullseye \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install --yes libfuse-dev pkg-config
              npm ci --ignore-scripts
              npm run prebuild
              node -e "require(\"node-gyp-build\")(\".\")"
            '

      - name: Install macFUSE build dependency
        if: matrix.platform == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --cask macfuse

      - name: Install JavaScript dependencies
        if: matrix.platform == 'darwin'
        run: npm ci --ignore-scripts

      - name: Build macOS Node-API prebuild
        if: matrix.platform == 'darwin'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: npm run prebuild

      - name: Verify prebuild
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.node
        run: |
          test -f "$PREBUILD"
          file "$PREBUILD"

      - name: Verify Linux linkage
        if: matrix.platform == 'linux'
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.node
        run: |
          ldd "$PREBUILD" | grep 'libfuse.so.2'
          newest_glibc="$(
            objdump -T "$PREBUILD" |
              grep -o 'GLIBC_[0-9.]*' |
              sort --version-sort --unique |
              tail -1
          )"
          test -n "$newest_glibc"
          test "$(
            printf '%s\n' "$newest_glibc" GLIBC_2.31 |
              sort --version-sort |
              tail -1
          )" = GLIBC_2.31

      - name: Verify macOS linkage
        if: matrix.platform == 'darwin'
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.node
        run: |
          otool -L "$PREBUILD" | grep '/usr/local/lib/libfuse.2.dylib'
          xcrun vtool -show-build "$PREBUILD" | grep 'minos 12.0'

      - name: Upload prebuild
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds/
          if-no-files-found: error

  smoke:
    name: Load ${{ matrix.platform }}-${{ matrix.arch }} / Node.js ${{ matrix.node-version }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 20
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 20
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 20
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 20
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 22
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 22
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 22
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 22
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 24
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 24
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 24
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install Linux runtime dependency
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2

      - name: Install macFUSE runtime dependency
        if: matrix.platform == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --cask macfuse

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Download native prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds

      - name: Load prebuild without compiling
        run: |
          test ! -d build
          node -e "const Fuse = require('./'); if (typeof Fuse !== 'function') process.exit(1)"

  package:
    name: Assemble npm package
    needs:
      - build
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Download all prebuilds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: Verify all release targets
        run: |
          test -f prebuilds/linux-x64/fuse-napi.node
          test -f prebuilds/linux-arm64/fuse-napi.node
          test -f prebuilds/darwin-x64/fuse-napi.node
          test -f prebuilds/darwin-arm64/fuse-napi.node

      - name: Pack npm tarball
        run: |
          npm pack
          tar -tzf fuse-napi-*.tgz | grep 'prebuilds/linux-x64/fuse-napi.node'
          tar -tzf fuse-napi-*.tgz | grep 'prebuilds/linux-arm64/fuse-napi.node'
          tar -tzf fuse-napi-*.tgz | grep 'prebuilds/darwin-x64/fuse-napi.node'
          tar -tzf fuse-napi-*.tgz | grep 'prebuilds/darwin-arm64/fuse-napi.node'

      - name: Upload npm tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: fuse-napi-*.tgz
          if-no-files-found: error
