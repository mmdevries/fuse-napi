name: Node-API prebuilds

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tagged package to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Verify package, lockfile, README, and release tag
        run: node scripts/verify-release.js

  ci:
    name: Required CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  quality:
    name: Release quality gate
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install FUSE 2 build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse-dev pkg-config

      - name: Install exact dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm run check
          npm run test:types
          npm run test:unit
          npm audit --omit=dev

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs:
      - validate
      - ci
      - quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Build Linux Node-API prebuild on the glibc 2.31 baseline
        if: matrix.platform == 'linux'
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            node:20-bullseye \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install --yes libfuse-dev pkg-config
              npm ci --ignore-scripts
              npm run prebuild
              node -e "require(\"node-gyp-build\")(\".\")"
            '

      - name: Install macFUSE build dependency
        if: matrix.platform == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --cask macfuse

      - name: Install JavaScript dependencies
        if: matrix.platform == 'darwin'
        run: npm ci --ignore-scripts

      - name: Build macOS Node-API prebuild
        if: matrix.platform == 'darwin'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: npm run prebuild

      - name: Verify prebuild
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.node
        run: |
          test -f "$PREBUILD"
          file "$PREBUILD"

      - name: Verify Linux linkage
        if: matrix.platform == 'linux'
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.node
        run: |
          ldd "$PREBUILD" | grep 'libfuse.so.2'
          newest_glibc="$(
            objdump -T "$PREBUILD" |
              grep -o 'GLIBC_[0-9.]*' |
              sort --version-sort --unique |
              tail -1
          )"
          test -n "$newest_glibc"
          test "$(
            printf '%s\n' "$newest_glibc" GLIBC_2.31 |
              sort --version-sort |
              tail -1
          )" = GLIBC_2.31

      - name: Verify macOS linkage
        if: matrix.platform == 'darwin'
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.node
        run: |
          otool -L "$PREBUILD" | grep '/usr/local/lib/libfuse.2.dylib'
          xcrun vtool -show-build "$PREBUILD" | grep 'minos 12.0'

      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds/
          if-no-files-found: error

  smoke:
    name: Load ${{ matrix.platform }}-${{ matrix.arch }} / Node.js ${{ matrix.node-version }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 20
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 20
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 20
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 20
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 22
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 22
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 22
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 22
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 24
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 24
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 24
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install Linux runtime dependency
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2

      - name: Install macFUSE runtime dependency
        if: matrix.platform == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --cask macfuse

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Download native prebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds

      - name: Load prebuild without compiling
        run: |
          test ! -d build
          node -e "const Fuse = require('./'); if (typeof Fuse !== 'function') process.exit(1)"

  package:
    name: Assemble npm package
    needs:
      - build
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Download all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: Verify all release targets
        run: |
          test -f prebuilds/linux-x64/fuse-napi.node
          test -f prebuilds/linux-arm64/fuse-napi.node
          test -f prebuilds/darwin-x64/fuse-napi.node
          test -f prebuilds/darwin-arm64/fuse-napi.node
          npm run verify:release

      - name: Pack npm tarball
        run: |
          npm pack
          tar -tzf fuse-napi-*.tgz | grep 'prebuilds/linux-x64/fuse-napi.node'
          tar -tzf fuse-napi-*.tgz | grep 'prebuilds/linux-arm64/fuse-napi.node'
          tar -tzf fuse-napi-*.tgz | grep 'prebuilds/darwin-x64/fuse-napi.node'
          tar -tzf fuse-napi-*.tgz | grep 'prebuilds/darwin-arm64/fuse-napi.node'
          shasum -a 256 fuse-napi-*.tgz > SHA256SUMS

      - name: Upload npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            fuse-napi-*.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  package-smoke:
    name: Install npm tarball on ${{ matrix.platform }}-${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install Linux runtime dependency
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse libfuse2

      - name: Enable Linux FUSE device
        if: matrix.platform == 'linux'
        run: |
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse

      - name: Install macFUSE runtime dependency
        if: matrix.platform == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --cask macfuse

      - name: Download assembled npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Verify and install the exact npm tarball
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS
          tarball="$(find "$PWD" -type f -name 'fuse-napi-*.tgz' -print -quit)"
          test -n "$tarball"
          consumer="$(mktemp -d "$RUNNER_TEMP/fuse-napi-consumer.XXXXXX")"
          printf 'FUSE_NAPI_CONSUMER=%s\n' "$consumer" >> "$GITHUB_ENV"
          npm install --prefix "$consumer" --ignore-scripts "$tarball"
          test ! -d "$consumer/node_modules/fuse-napi/build"
          node -e "const Fuse = require(process.argv[1]); if (typeof Fuse !== 'function') process.exit(1)" \
            "$consumer/node_modules/fuse-napi"

      - name: Mount and exercise the exact Linux npm tarball
        if: matrix.platform == 'linux'
        run: |
          node scripts/package-mount-smoke.js \
            "$FUSE_NAPI_CONSUMER/node_modules/fuse-napi"

  macos-package-mount:
    name: Mount npm tarball on macOS ${{ matrix.arch }}
    needs: package
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: '["self-hosted","macOS","ARM64","macfuse"]'
          - arch: x64
            runner: '["self-hosted","macOS","X64","macfuse"]'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Verify prepared macFUSE host
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(node -p process.arch)" = "$EXPECTED_ARCH"
          pkg-config --modversion fuse

      - name: Run full source mount integration suite
        run: |
          npm ci
          npm test

      - name: Download assembled npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Install and mount the exact npm tarball
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS
          tarball="$(find "$PWD" -type f -name 'fuse-napi-*.tgz' -print -quit)"
          test -n "$tarball"
          consumer="$(mktemp -d "$RUNNER_TEMP/fuse-napi-consumer.XXXXXX")"
          npm install --prefix "$consumer" --ignore-scripts "$tarball"
          test ! -d "$consumer/node_modules/fuse-napi/build"
          node "$GITHUB_WORKSPACE/scripts/package-mount-smoke.js" \
            "$consumer/node_modules/fuse-napi"

  publish:
    name: Publish verified npm package
    if: github.ref_type == 'tag' && inputs.publish
    needs:
      - package-smoke
      - macos-package-mount
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Download verified npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Publish with provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS
          tarball="$(find "$PWD" -type f -name 'fuse-napi-*.tgz' -print -quit)"
          test -n "$tarball"
          case "$RELEASE_TAG" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish "$tarball" --access public --provenance --tag "$dist_tag"
