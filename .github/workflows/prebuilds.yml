name: ABI-specific Node.js prebuilds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify package, lockfile, README, and release tag when present
        run: node scripts/verify-release.js

  ci:
    name: Required CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  quality:
    name: Release quality gate
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install FUSE 3 build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse3-dev fuse3 pkg-config

      - name: Install exact dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm run check
          npm run test:types
          npm run test:unit
          npm audit --omit=dev

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }} / Node.js ${{ matrix.node-version }}
    needs:
      - validate
      - ci
      - quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 22
            abi: 127
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 22
            abi: 127
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 22
            abi: 127
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 22
            abi: 127
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 24
            abi: 137
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 24
            abi: 137
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 24
            abi: 137
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 24
            abi: 137
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 26
            abi: 147
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 26
            abi: 147
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 26
            abi: 147
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 26
            abi: 147

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Build Linux ABI-specific prebuild on the glibc 2.31 baseline
        if: matrix.platform == 'linux'
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            node:${{ matrix.node-version }}-bullseye \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install --yes libfuse3-dev fuse3 pkg-config
              npm ci --ignore-scripts
              npm run prebuild -- --target ${{ matrix.node-version }}.0.0
              node -e "require(\"node-gyp-build\")(\".\")"
            '

      - name: Install macFUSE build dependency
        if: matrix.platform == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --cask macfuse

      - name: Install JavaScript dependencies
        if: matrix.platform == 'darwin'
        run: npm ci --ignore-scripts

      - name: Build macOS ABI-specific prebuild
        if: matrix.platform == 'darwin'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: npm run prebuild -- --target ${{ matrix.node-version }}.0.0

      - name: Verify prebuild
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.abi${{ matrix.abi }}.node
        run: |
          test -f "$PREBUILD"
          file "$PREBUILD"

      - name: Verify Linux linkage
        if: matrix.platform == 'linux'
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.abi${{ matrix.abi }}.node
        run: |
          ldd "$PREBUILD" | grep 'libfuse3.so.3'
          newest_glibc="$(
            objdump -T "$PREBUILD" |
              grep -o 'GLIBC_[0-9.]*' |
              sort --version-sort --unique |
              tail -1
          )"
          test -n "$newest_glibc"
          test "$(
            printf '%s\n' "$newest_glibc" GLIBC_2.31 |
              sort --version-sort |
              tail -1
          )" = GLIBC_2.31

      - name: Verify macOS linkage
        if: matrix.platform == 'darwin'
        env:
          PREBUILD: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/fuse-napi.abi${{ matrix.abi }}.node
        run: |
          otool -L "$PREBUILD" | grep '/usr/local/lib/libfuse3'
          xcrun vtool -show-build "$PREBUILD" | grep 'minos 12.0'

      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}-node${{ matrix.node-version }}
          path: prebuilds/
          if-no-files-found: error

  build-modern-linux:
    name: Build Linux ${{ matrix.arch }} libfuse ABI 4 / Node.js ${{ matrix.node-version }}
    needs:
      - validate
      - ci
      - quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            node-version: 22
            abi: 127
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 22
            abi: 127
          - runner: ubuntu-24.04
            arch: x64
            node-version: 24
            abi: 137
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 24
            abi: 137
          - runner: ubuntu-24.04
            arch: x64
            node-version: 26
            abi: 147
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 26
            abi: 147

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ABI-specific prebuild with libfuse 3.18.2 on glibc 2.31
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            node:${{ matrix.node-version }}-bullseye \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install --yes \
                build-essential curl libudev-dev ninja-build pkg-config python3-pip
              printf "%s\n" \
                "meson==1.7.2 --hash=sha256:82c6818dc81743c96de3a458f06175776ebfde4081195ea31ea6971838f25e38" \
                > /tmp/meson-requirements.txt
              python3 -m pip install --require-hashes -r /tmp/meson-requirements.txt
              curl --fail --location --silent --show-error \
                https://github.com/libfuse/libfuse/releases/download/fuse-3.18.2/fuse-3.18.2.tar.gz \
                --output /tmp/fuse-3.18.2.tar.gz
              printf "%s  %s\n" \
                f01de85717e20adf5f98aff324acd85dd73d61a5ca3834d573dcf0bd6e54a298 \
                /tmp/fuse-3.18.2.tar.gz |
                sha256sum --check --strict
              tar -xzf /tmp/fuse-3.18.2.tar.gz -C /tmp
              meson setup /tmp/fuse-build /tmp/fuse-3.18.2 \
                -Dexamples=false -Dtests=false
              meson compile -C /tmp/fuse-build
              meson install -C /tmp/fuse-build
              ldconfig
              test "$(pkg-config --modversion fuse3)" = 3.18.2
              npm ci --ignore-scripts
              npm run prebuild -- --target ${{ matrix.node-version }}.0.0
              mv \
                prebuilds/linux-${{ matrix.arch }} \
                prebuilds/linux-${{ matrix.arch }}-fuse4
              rm -rf build
              PREBUILDS_ONLY=1 node -e "
                const binding = require(\"./lib/native-binding\")
                  .loadNativeBinding(process.cwd())
                const runtime = binding.fuse_native_runtime_info()
                if (runtime.version !== \"3.18.2\" || !runtime.hasStatx) process.exit(1)
              "
            '

      - name: Verify modern Linux prebuild and baseline
        env:
          PREBUILD: prebuilds/linux-${{ matrix.arch }}-fuse4/fuse-napi.abi${{ matrix.abi }}.node
        run: |
          test -f "$PREBUILD"
          file "$PREBUILD"
          ldd "$PREBUILD" | grep 'libfuse3.so.4'
          newest_glibc="$(
            objdump -T "$PREBUILD" |
              grep -o 'GLIBC_[0-9.]*' |
              sort --version-sort --unique |
              tail -1
          )"
          test -n "$newest_glibc"
          test "$(
            printf '%s\n' "$newest_glibc" GLIBC_2.31 |
              sort --version-sort |
              tail -1
          )" = GLIBC_2.31

      - name: Upload modern Linux prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-linux-${{ matrix.arch }}-fuse4-node${{ matrix.node-version }}
          path: prebuilds/
          if-no-files-found: error

  build-musl-linux:
    name: Build Alpine musl ${{ matrix.arch }} / Node.js ${{ matrix.node-version }}
    needs:
      - validate
      - ci
      - quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            node-version: 22
            abi: 127
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 22
            abi: 127
          - runner: ubuntu-24.04
            arch: x64
            node-version: 24
            abi: 137
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 24
            abi: 137
          - runner: ubuntu-24.04
            arch: x64
            node-version: 26
            abi: 147
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 26
            abi: 147

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ABI-specific musl prebuild on Alpine 3.23
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            node:${{ matrix.node-version }}-alpine3.23 \
            sh -eux -c '
              apk add --no-cache \
                build-base fuse3 fuse3-dev linux-headers pkgconf python3
              test "$(pkg-config --modversion fuse3)" = 3.17.3
              npm ci --ignore-scripts
              npm run prebuild -- \
                --target ${{ matrix.node-version }}.0.0 \
                --tag-libc
              mv \
                prebuilds/linux-${{ matrix.arch }} \
                prebuilds/linux-${{ matrix.arch }}-fuse4
              rm -rf build
              PREBUILDS_ONLY=1 node -e "
                const binding = require(\"./lib/native-binding\")
                  .loadNativeBinding(process.cwd())
                const runtime = binding.fuse_native_runtime_info()
                if (runtime.version !== \"3.17.3\") process.exit(1)
              "
            '

      - name: Verify musl prebuild and SONAME
        env:
          PREBUILD: prebuilds/linux-${{ matrix.arch }}-fuse4/fuse-napi.abi${{ matrix.abi }}.musl.node
        run: |
          test -f "$PREBUILD"
          file "$PREBUILD"
          readelf -d "$PREBUILD" | grep 'libfuse3.so.4'

      - name: Upload musl prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-linux-${{ matrix.arch }}-fuse4-musl-node${{ matrix.node-version }}
          path: prebuilds/
          if-no-files-found: error

  smoke:
    name: Load ${{ matrix.platform }}-${{ matrix.arch }} / Node.js ${{ matrix.node-version }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 26
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 26
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 26
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 26
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 22
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 22
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 22
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 22
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 24
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 24
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 24
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install Linux runtime dependency
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse3-3 fuse3

      - name: Install macFUSE runtime dependency
        if: matrix.platform == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --cask macfuse

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Download native prebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}-node${{ matrix.node-version }}
          path: prebuilds

      - name: Load prebuild without compiling
        run: |
          test ! -d build
          node -e "const Fuse = require('./'); if (typeof Fuse !== 'function') process.exit(1)"

  package:
    name: Assemble npm package
    needs:
      - build
      - build-modern-linux
      - build-musl-linux
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Download all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: Verify all release targets
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            test -f "prebuilds/$target/fuse-napi.abi127.node"
            test -f "prebuilds/$target/fuse-napi.abi137.node"
            test -f "prebuilds/$target/fuse-napi.abi147.node"
          done
          for target in linux-x64-fuse4 linux-arm64-fuse4; do
            test -f "prebuilds/$target/fuse-napi.abi127.node"
            test -f "prebuilds/$target/fuse-napi.abi137.node"
            test -f "prebuilds/$target/fuse-napi.abi147.node"
            test -f "prebuilds/$target/fuse-napi.abi127.musl.node"
            test -f "prebuilds/$target/fuse-napi.abi137.musl.node"
            test -f "prebuilds/$target/fuse-napi.abi147.musl.node"
          done
          npm run verify:release

      - name: Pack npm tarball
        run: |
          npm pack
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            for abi in 127 137 147; do
              tar -tzf fuse-napi-*.tgz |
                grep "prebuilds/$target/fuse-napi.abi$abi.node"
            done
          done
          for target in linux-x64-fuse4 linux-arm64-fuse4; do
            for abi in 127 137 147; do
              tar -tzf fuse-napi-*.tgz |
                grep "prebuilds/$target/fuse-napi.abi$abi.node"
              tar -tzf fuse-napi-*.tgz |
                grep "prebuilds/$target/fuse-napi.abi$abi.musl.node"
            done
          done
          npm sbom --omit=dev --sbom-format cyclonedx > fuse-napi-sbom.cdx.json
          shasum -a 256 fuse-napi-*.tgz fuse-napi-sbom.cdx.json > SHA256SUMS

      - name: Attest package build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: fuse-napi-*.tgz

      - name: Attest package SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: fuse-napi-*.tgz
          sbom-path: fuse-napi-sbom.cdx.json

      - name: Upload npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            fuse-napi-*.tgz
            fuse-napi-sbom.cdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  package-smoke:
    name: Install npm tarball on ${{ matrix.platform }}-${{ matrix.arch }} / Node.js ${{ matrix.node-version }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 22
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 22
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 22
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 22
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 24
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 24
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 24
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 24
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            node-version: 26
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node-version: 26
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            node-version: 26
          - runner: macos-15
            platform: darwin
            arch: arm64
            node-version: 26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install Linux runtime dependency
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3 libfuse3-3

      - name: Enable Linux FUSE device
        if: matrix.platform == 'linux'
        run: |
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse

      - name: Install macFUSE runtime dependency
        if: matrix.platform == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --cask macfuse

      - name: Download assembled npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Verify and install the exact npm tarball
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS
          tarball="$(find "$PWD" -type f -name 'fuse-napi-*.tgz' -print -quit)"
          test -n "$tarball"
          consumer="$(mktemp -d "$RUNNER_TEMP/fuse-napi-consumer.XXXXXX")"
          printf 'FUSE_NAPI_CONSUMER=%s\n' "$consumer" >> "$GITHUB_ENV"
          npm install --prefix "$consumer" --ignore-scripts "$tarball"
          test ! -d "$consumer/node_modules/fuse-napi/build"
          node -e "const Fuse = require(process.argv[1]); if (typeof Fuse !== 'function') process.exit(1)" \
            "$consumer/node_modules/fuse-napi"

      - name: Mount and exercise the exact Linux npm tarball
        if: matrix.platform == 'linux'
        run: |
          node scripts/package-mount-smoke.js \
            "$FUSE_NAPI_CONSUMER/node_modules/fuse-napi"

  modern-package-smoke:
    name: Mount exact npm tarball with libfuse 3.18 / SONAME 4
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build and install verified libfuse 3.18.2
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl libudev-dev meson ninja-build pkg-config
          curl --fail --location --silent --show-error \
            https://github.com/libfuse/libfuse/releases/download/fuse-3.18.2/fuse-3.18.2.tar.gz \
            --output "$RUNNER_TEMP/fuse-3.18.2.tar.gz"
          printf '%s  %s\n' \
            f01de85717e20adf5f98aff324acd85dd73d61a5ca3834d573dcf0bd6e54a298 \
            "$RUNNER_TEMP/fuse-3.18.2.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/fuse-3.18.2.tar.gz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/fuse-build" "$RUNNER_TEMP/fuse-3.18.2" \
            -Dexamples=false -Dtests=false
          meson compile -C "$RUNNER_TEMP/fuse-build"
          sudo meson install -C "$RUNNER_TEMP/fuse-build"
          sudo ldconfig
          test "$(pkg-config --modversion fuse3)" = 3.18.2
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse

      - name: Download assembled npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Install and exercise the exact modern npm package
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS
          tarball="$(find "$PWD" -type f -name 'fuse-napi-*.tgz' -print -quit)"
          test -n "$tarball"
          consumer="$(mktemp -d "$RUNNER_TEMP/fuse-napi-modern-consumer.XXXXXX")"
          npm install --prefix "$consumer" --ignore-scripts "$tarball"
          package_root="$consumer/node_modules/fuse-napi"
          test ! -d "$package_root/build"
          ldd "$package_root/prebuilds/linux-x64-fuse4/fuse-napi.abi127.node" |
            grep 'libfuse3.so.4'
          node ../scripts/modern-operations-smoke.js "$package_root"

  musl-package-smoke:
    name: Load exact npm tarball on Alpine ${{ matrix.arch }} / Node.js ${{ matrix.node-version }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            node-version: 22
            abi: 127
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 22
            abi: 127
          - runner: ubuntu-24.04
            arch: x64
            node-version: 24
            abi: 137
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 24
            abi: 137
          - runner: ubuntu-24.04
            arch: x64
            node-version: 26
            abi: 147
          - runner: ubuntu-24.04-arm
            arch: arm64
            node-version: 26
            abi: 147

    steps:
      - name: Download assembled npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Install and load the exact npm package on Alpine 3.23
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS
          tarball="$(find "$PWD" -type f -name 'fuse-napi-*.tgz' -print -quit)"
          test -n "$tarball"
          docker run --rm \
            --volume "$tarball:/release/fuse-napi.tgz:ro" \
            node:${{ matrix.node-version }}-alpine3.23 \
            sh -eux -c '
              apk add --no-cache fuse3
              npm install \
                --prefix /tmp/fuse-napi-consumer \
                --ignore-scripts \
                /release/fuse-napi.tgz
              package_root=/tmp/fuse-napi-consumer/node_modules/fuse-napi
              test ! -d "$package_root/build"
              test -f \
                "$package_root/prebuilds/linux-${{ matrix.arch }}-fuse4/fuse-napi.abi${{ matrix.abi }}.musl.node"
              PREBUILDS_ONLY=1 node -e "
                const Fuse = require(\"$package_root\")
                if (typeof Fuse !== \"function\") process.exit(1)
              "
            '
