name: macOS mount integration

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: macos-mount-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: macOS ${{ matrix.arch }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: '["self-hosted","macOS","ARM64","macfuse"]'
            node-version: 20
          - arch: x64
            runner: '["self-hosted","macOS","X64","macfuse"]'
            node-version: 20
          - arch: arm64
            runner: '["self-hosted","macOS","ARM64","macfuse"]'
            node-version: 22
          - arch: x64
            runner: '["self-hosted","macOS","X64","macfuse"]'
            node-version: 22
          - arch: arm64
            runner: '["self-hosted","macOS","ARM64","macfuse"]'
            node-version: 24
          - arch: x64
            runner: '["self-hosted","macOS","X64","macfuse"]'
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Verify host
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(node -p process.arch)" = "$EXPECTED_ARCH"
          pkg-config --modversion fuse

      - name: Install and test
        run: |
          npm ci
          npm run check
          npm run test:types
          npm test
